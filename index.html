<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <meta name="description" content="2.5D Isometric Action RPG game engine and dungeon crawler featuring real-time isometric rendering, player combat, abilities, loot drops, inventory, and procedural dungeons." />
    <meta property="og:title" content="Dungeon Trouble" />
    <meta property="og:description" content="2.5D Isometric Action RPG game engine and dungeon crawler featuring real-time isometric rendering, player combat, abilities, loot drops, inventory, and procedural dungeons." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress unhandled rejections and errors originating from browser extensions (e.g. MetaMask, web3 injectors)
      (function() {
        var isExtensionError = function(msg, src) {
          if (!msg && !src) return false;
          var text = String(msg || '') + ' ' + String(src || '');
          return (
            text.includes('MetaMask') ||
            text.includes('ethereum') ||
            text.includes('chrome-extension://') ||
            text.includes('moz-extension://') ||
            text.includes('safari-web-extension://')
          );
        };

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionError(msg, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden select-none bg-slate-950 text-slate-100 font-sans">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
